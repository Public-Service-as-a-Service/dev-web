<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 318" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för Test-IdP med användaradministration"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="318" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — Test-IdP med användaradministration</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop och integrationer, härledda ur källkodens konfiguration.</text><rect x="490.0" y="84" rx="10" width="420" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="117.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">Webb-app</text><text x="700.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#46595f">web-app-fake-idp-admin</text><rect x="1130" y="91" rx="10" width="240" height="60" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1250.0" y="117.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Inloggning</text><text x="1250.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#46595f">Lokalt admin-konto (användarnamn/lösenord, hastighetsbegränsat) för admingränssnittet; verktyget är självt en test-IdP</text><path d="M 910.0 121.0 L 1130 121.0" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="1020.0" y="111.0" text-anchor="middle" font-size="11" fill="#64748b">autentisering</text><text x="40" y="210" font-size="12" fill="#46595f">• Avsett att ersätta det fristående verktyget web-app-fake-sso-idp enligt README.</text><text x="40" y="230" font-size="12" fill="#46595f">• Datamodellen innehåller User, Attribute och UserSettings i SQLite via Prisma.</text><text x="40" y="250" font-size="12" fill="#46595f">• Repot är nystartat (första sammanslagna ändringen juli 2026) och bygger på kommunens webbappstartmall.</text><rect x="40" y="278" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="291" font-size="12.5" fill="#1c2b33">Webb-app (denna applikation)</text><rect x="294.6" y="278" width="26" height="16" rx="4" fill="#bbe3cd" stroke="#15803d" stroke-width="1.5"/><text x="327.6" y="291" font-size="12.5" fill="#1c2b33">Kärn-API</text><rect x="415.20000000000005" y="278" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="448.20000000000005" y="291" font-size="12.5" fill="#1c2b33">Verksamhets-API</text><rect x="582.7" y="278" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="615.7" y="291" font-size="12.5" fill="#1c2b33">Master-data</text><rect x="723.4000000000001" y="278" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="756.4000000000001" y="291" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>