<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 590" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för Sundsvallsminnen – digitalt kulturarvsarkiv"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="590" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — Sundsvallsminnen – digitalt kulturarvsarkiv</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Alla verksamhetsanrop går från webbappens backend via kommunens API-plattform (WSO2).</text><rect x="490.0" y="84" rx="10" width="420" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="117.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">Webb-app</text><text x="700.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#46595f">web-app-memories</text><path d="M 700.0 158 L 700.0 210" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="188" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="210" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="235.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="254.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><rect x="40" y="324" rx="12" width="1320" height="124" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="348" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">VERKSAMHETS-API:ER — anropas av webb-appen via API-plattformen</text><rect x="597.5" y="364" rx="10" width="205" height="64" fill="#bbe3cd" stroke="#15803d" stroke-width="2"/><text x="700.0" y="392.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Memories 3.4</text><text x="700.0" y="411.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar och söker i minnesarkivet…</text><path d="M 700.0 268 C 700.0 316.0, 700.0 316.0, 700.0 364" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="482" font-size="12" fill="#46595f">• Inga SAML- eller inloggningsvariabler finns – tjänsten är helt publik.</text><text x="40" y="502" font-size="12" fill="#46595f">• Repot innehåller SQL-skript för en lokal kopia av arkivdatabasen (tabeller för bl.a. film) till utvecklingsmiljön.</text><text x="40" y="522" font-size="12" fill="#46595f">• Frontendpaketet heter web-app-sundsvallsminnen vilket bekräftar tjänstens namn.</text><rect x="40" y="550" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="563" font-size="12.5" fill="#1c2b33">Webb-app (denna applikation)</text><rect x="294.6" y="550" width="26" height="16" rx="4" fill="#bbe3cd" stroke="#15803d" stroke-width="1.5"/><text x="327.6" y="563" font-size="12.5" fill="#1c2b33">Kärn-API</text><rect x="415.20000000000005" y="550" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="448.20000000000005" y="563" font-size="12.5" fill="#1c2b33">Verksamhets-API</text><rect x="582.7" y="550" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="615.7" y="563" font-size="12.5" fill="#1c2b33">Master-data</text><rect x="723.4000000000001" y="550" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="756.4000000000001" y="563" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>