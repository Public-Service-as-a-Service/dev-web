<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 318" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för Test-IdP för utveckling"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="318" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — Test-IdP för utveckling</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop och integrationer, härledda ur källkodens konfiguration.</text><rect x="490.0" y="84" rx="10" width="420" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="117.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">Webb-app</text><text x="700.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#46595f">Node.js/Express (JavaScript, npm-paketet fake-sso-idp) — web-app-fake-sso-idp</text><text x="40" y="210" font-size="12" fill="#46595f">• Fork av det öppna npm-paketet fake-sso-idp med tillägg för RelayState och audience.</text><text x="40" y="230" font-size="12" fill="#46595f">• Refereras som lokal inloggningslösning i andra kommun-repon, t.ex. Systemregistret.</text><text x="40" y="250" font-size="12" fill="#46595f">• Planeras ersättas av web-app-fake-idp-admin enligt det repots README.</text><rect x="40" y="278" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="291" font-size="12.5" fill="#1c2b33">Webb-app (denna applikation)</text><rect x="294.6" y="278" width="26" height="16" rx="4" fill="#bbe3cd" stroke="#15803d" stroke-width="1.5"/><text x="327.6" y="291" font-size="12.5" fill="#1c2b33">Kärn-API</text><rect x="415.20000000000005" y="278" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="448.20000000000005" y="291" font-size="12.5" fill="#1c2b33">Verksamhets-API</text><rect x="582.7" y="278" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="615.7" y="291" font-size="12.5" fill="#1c2b33">Master-data</text><rect x="723.4000000000001" y="278" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="756.4000000000001" y="291" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>