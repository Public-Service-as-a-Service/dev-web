700.0 395.0, 919.0 395.0, 919.0 522" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="634" rx="12" width="1320" height="124" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="658" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">EXTERNA SYSTEM OCH INTEGRATIONER</text><rect x="597.5" y="674" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="702.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Digital brevlåda (via P…</text><text x="700.0" y="721.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 158 C 700.0 416.0, 700.0 416.0, 700.0 674" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="40" y="786" font-size="12" fill="#46595f">• Startsidan anger pris per mottagare (0,5 kr för digitalt brev), vilket visar att tjänsten används skarpt för kostnadseffektiva utskick.</text><text x="40" y="806" font-size="12" fill="#46595f">• Repot innehåller även en separat admin-app utöver frontend och backend.</text><text x="40" y="826" font-size="12" fill="#46595f">• Aktivt underhållet med över 175 sammanslagna pull requests, senast juli 2026.</text><rect x="40" y="854" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="867" font-size="12.5" fill="#1c2b33">Webb-app (denna applikation)</text><rect x="294.6" y="854" width="26" height="16" rx="4" fill="#bbe3cd" stroke="#15803d" stroke-width="1.5"/><text x="327.6" y="867" font-size="12.5" fill="#1c2b33">Kärn-API</text><rect x="415.20000000000005" y="854" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="448.20000000000005" y="867" font-size="12.5" fill="#1c2b33">Verksamhets-API</text><rect x="582.7" y="854" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke