t-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="254.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><rect x="40" y="324" rx="12" width="1320" height="124" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="348" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">VERKSAMHETS-API:ER — anropas av webb-appen via API-plattformen</text><rect x="269.0" y="364" rx="10" width="205" height="64" fill="#bbe3cd" stroke="#15803d" stroke-width="2"/><text x="371.5" y="392.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">PostPortalService 1.8</text><text x="371.5" y="411.0" text-anchor="middle" font-size="11.5" fill="#46595f">Själva utskickstjänsten: brev, r…</text><path d="M 700.0 268 C 700.0 316.0, 371.5 316.0, 371.5 364" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="488.0" y="364" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="590.5" y="392.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Company 1.0</text><text x="590.5" y="411.0" text-anchor="middle" font-size="11.5" fill="#46595f">Uppslag av företag som mottagare.</text><path d="M 700.0 268 C 700.0 316.0, 590.5 316.0, 590.5 364" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="707.0" y="364" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="809.5" y="392.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">MessagingSettings 3.0</text><text x="809.5" y="411.0" text-anchor="middle" font-size="11.5" fill="#46595f">Inställningar för avsändare och…</text><path d="M 700.0 268 C 700.0 316.0, 809.5 316.0, 809.5 364" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="926.0" y="364" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#1