<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för CareManagement 1.0"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="860" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — CareManagement 1.0</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Konsumenter når API:et via kommunens API-plattform (WSO2); tjänsten anropar i sin tur andra mikrotjänster.</text><rect x="490.0" y="84" rx="10" width="420" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Konsumerande applikationer</text><text x="700.0" y="131.0" text-anchor="middle" font-size="11.5" fill="#46595f">webbappar, e-tjänster och verksamhetssystem</text><path d="M 700.0 148 L 700.0 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="176" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="194" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="219.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="238.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><path d="M 700.0 252 L 700.0 298" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><rect x="480.0" y="298" rx="10" width="440" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">CareManagement 1.0</text><text x="700.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">api-service-caremanagement</text><rect x="1110" y="305" rx="10" width="260" height="60" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1240.0" y="331.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Databas</text><text x="1240.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">MariaDB</text><path d="M 920.0 335.0 L 1110 335.0" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><text x="1015.0" y="325.0" text-anchor="middle" font-size="11" fill="#b45309">lagring</text><rect x="40" y="424" rx="12" width="1320" height="124" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="448" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">BEROENDE MIKROTJÄNSTER — anropas av tjänsten</text><rect x="159.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="262.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Operaton 1.0</text><text x="262.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Startar processinstanser, uppdat…<title>Startar processinstanser, uppdaterar processvariabler och korrelerar BPMN-meddelanden för ärendenas processer.</title></text><path d="M 700.0 372 C 700.0 418.0, 262.0 418.0, 262.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="378.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="481.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Citizen v3</text><text x="481.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Översätter partyId till personnum…<title>Översätter partyId till personnummer innan Lifecare och FinancialAid anropas.</title></text><path d="M 700.0 372 C 700.0 418.0, 481.0 418.0, 481.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">FinancialAid</text><text x="700.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar den sökandes samlade i…<title>Hämtar den sökandes samlade inkomstunderlag ur SSBTEK (Försäkringskassans sammansatta bastjänst) via kommunens proxy.</title></text><path d="M 700.0 372 C 700.0 418.0, 700.0 418.0, 700.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="816.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="919.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 1.0</text><text x="919.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Klient konfigurerad; anropas änn…<title>Klient konfigurerad; anropas ännu inte från tjänstelagret.</title></text><path d="M 700.0 372 C 700.0 418.0, 919.0 418.0, 919.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1035.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1138.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Templating 2.0</text><text x="1138.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Klient för PDF-rendering konfigur…<title>Klient för PDF-rendering konfigurerad; anropas ännu inte från tjänstelagret.</title></text><path d="M 700.0 372 C 700.0 418.0, 1138.0 418.0, 1138.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="582" rx="12" width="1320" height="124" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="606" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">EXTERNA SYSTEM OCH INTEGRATIONER</text><rect x="488.0" y="622" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="590.5" y="650.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Lifecare FamilyCare (Tiet…<title>Lifecare FamilyCare (Tietoevry – individ- och familjeomsorgens verksamhetssystem, domän och API-nyckel)</title></text><text x="590.5" y="669.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 497.0, 590.5 497.0, 590.5 622" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="707.0" y="622" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="809.5" y="650.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">UiPath Orchestrator (RP…<title>UiPath Orchestrator (RPA-kö för skrivningar till Lifecare)</title></text><text x="809.5" y="669.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 497.0, 809.5 497.0, 809.5 622" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="40" y="734" font-size="12" fill="#46595f">• Specifikationen har växt från 40 till 126 operationer utan versionsbyte (info.version är fortfarande 1.0); resurserna för fria ärende- och intressentparametrar har tagits bort och ersatts av typade ärendedata per ärendetyp.</text><text x="40" y="754" font-size="12" fill="#46595f">• Behörighetsprövningen väger samman befintliga ärenden i CareManagement och Lifecare, ansökningsmånad och nyligen avslutade ärenden; ett ärende som skapas inom 30 dagar efter ett avslutat fryses för manuell granskning – enligt</text><text x="50.007999999999996" y="772" font-size="12" fill="#46595f">konfigurationen i application.yml och specifikationen.</text><text x="40" y="792" font-size="12" fill="#46595f">• Normberäkningen förbereds dagligen utan skrivning till Lifecare; handläggarens radändringar överlever den dagliga uppdateringen, och beräkningen skrivs till Lifecare först efter beslut – enligt specifikationens beskrivning av beräkningsresurserna.</text><rect x="40" y="820" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="833" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="820" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="833" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="820" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="833" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="820" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="833" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>