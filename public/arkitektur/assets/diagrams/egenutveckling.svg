<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 826" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Fokusområdet Förenkla för medborgare och företagare i Sundsvalls kommuns egenutveckling"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="826" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Fokusområde — Förenkla för medborgare och företagare</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. AI-märket anger förmågor med inbyggt AI-stöd; i ärendeflödena maximeras automatiseringsgraden.</text><rect x="520.0" y="90" rx="10" width="360" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="119.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Invånare och företagare</text><path d="M 700.0 138 L 700.0 172" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="390.0" y="172" rx="10" width="620" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="205.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">Mina sidor</text><text x="700.0" y="224.0" text-anchor="middle" font-size="11.5" fill="#46595f">personaliserad hantering av ärenden, avvikelser, fakturor med mera</text><rect x="966.0" y="163" rx="9" width="34" height="18" fill="#005a70"/><text x="983.0" y="176.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AI</text><path d="M 700.0 246 L 700.0 310" fill="none" stroke="#15803d" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="712.0" y="282" font-size="11" fill="#46595f">registrera, uppdatera, läs status och historik</text><rect x="40" y="310" rx="12" width="1320" height="128" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="334" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">ÄRENDEOMRÅDEN — HANDLÄGGS AV MEDARBETARE</text><rect x="71.0" y="350" rx="10" width="410" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="276.0" y="378.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Avvikelsehantering</text><text x="276.0" y="397.0" text-anchor="middle" font-size="11" fill="#46595f">felanmälan, orosanmälan med mera</text><rect x="437.0" y="341" rx="9" width="34" height="18" fill="#005a70"/><text x="454.0" y="354.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AI</text><rect x="495.0" y="350" rx="10" width="410" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="378.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Support</text><text x="700.0" y="397.0" text-anchor="middle" font-size="11" fill="#46595f">kontaktcenter med flera verksamheter</text><rect x="861.0" y="341" rx="9" width="34" height="18" fill="#005a70"/><text x="878.0" y="354.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AI</text><rect x="919.0" y="350" rx="10" width="410" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1124.0" y="378.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Myndighetsärenden</text><text x="1124.0" y="397.0" text-anchor="middle" font-size="11" fill="#46595f">bygglov, färdtjänst, miljö, alkohol och tobak med mera</text><rect x="1285.0" y="341" rx="9" width="34" height="18" fill="#005a70"/><text x="1302.0" y="354.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AI</text><path d="M 276.0 438 L 276.0 494" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 700.0 438 L 700.0 494" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 1124.0 438 L 1124.0 494" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="494" rx="12" width="1320" height="188" fill="#fdf8ea" stroke="#b45309" stroke-width="1.5" opacity="0.55"/><text x="56" y="518" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">GEMENSAMMA STÖDFÖRMÅGOR — ANVÄNDS AV ALLA ÄRENDEOMRÅDEN</text><rect x="71.0" y="534" rx="10" width="410" height="56" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="276.0" y="558.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Dokumenthantering</text><text x="276.0" y="577.0" text-anchor="middle" font-size="10.5" fill="#46595f">personalakter med flera</text><rect x="495.0" y="534" rx="10" width="410" height="56" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="700.0" y="558.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Diarium</text><text x="700.0" y="577.0" text-anchor="middle" font-size="10.5" fill="#46595f">registrering av handlingar</text><rect x="919.0" y="534" rx="10" width="410" height="56" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1124.0" y="558.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">E-arkiv</text><text x="1124.0" y="577.0" text-anchor="middle" font-size="10.5" fill="#46595f">långsiktigt digitalt bevarande</text><rect x="71.0" y="606" rx="10" width="410" height="56" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="276.0" y="630.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">E-signering</text><text x="276.0" y="649.0" text-anchor="middle" font-size="10.5" fill="#46595f">elektroniska underskrifter</text><rect x="495.0" y="606" rx="10" width="410" height="56" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="700.0" y="630.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Kommunikation</text><text x="700.0" y="649.0" text-anchor="middle" font-size="10.5" fill="#46595f">meddelanden och utskick i alla kanaler</text><rect x="919.0" y="606" rx="10" width="410" height="56" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1124.0" y="630.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Masterdata</text><text x="1124.0" y="649.0" text-anchor="middle" font-size="10.5" fill="#46595f">metakatalog — gemensamma grunddata om personer, företag och organisation</text><text x="40" y="716" font-size="12" fill="#46595f">• Invånare och företagare möter samma ärendeområden via Mina sidor som medarbetarna handlägger i — en förmåga per område, inte parallella lösningar.</text><text x="40" y="736" font-size="12" fill="#46595f">• AI-stöd byggs in i förmågorna och automatiseringsgraden maximeras i ärendeflödena, med manuell handläggning som undantag.</text><text x="40" y="756" font-size="12" fill="#46595f">• Förmågorna delar grunddata, ärendeinformation och stödförmågor, vilket håller helheten samman — och de delas med andra kommuner via Kommuna.</text><rect x="40" y="786" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="799" font-size="12.5" fill="#1c2b33">Digital kanal</text><rect x="227" y="786" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="260" y="799" font-size="12.5" fill="#1c2b33">Ärendeområden</text><rect x="414" y="786" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="447" y="799" font-size="12.5" fill="#1c2b33">Gemensamma stödförmågor</text><rect x="681" y="785" rx="9" width="34" height="18" fill="#005a70"/><text x="698" y="798.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AI</text><text x="722" y="799" font-size="12.5" fill="#1c2b33">Inbyggt AI-stöd</text></svg>