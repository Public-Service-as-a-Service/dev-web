<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1086" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Översikt över Sundsvalls kommuns målarkitektur"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="1086" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Målarkitektur — Sundsvalls kommun</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Ett ekosystem av egenutvecklade och upphandlade komponenter; funktionalitet och data exponeras via API:er.</text><rect x="40" y="86" rx="12" width="1320" height="96" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="110" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">ANVÄNDARE</text><rect x="179.0" y="122" rx="10" width="250" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="304.0" y="151.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Invånare</text><rect x="443.0" y="122" rx="10" width="250" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="568.0" y="151.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Företag</text><rect x="707.0" y="122" rx="10" width="250" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="832.0" y="151.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Medarbetare</text><rect x="971.0" y="122" rx="10" width="250" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1096.0" y="142.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Externa aktörer</text><text x="1096.0" y="161.0" text-anchor="middle" font-size="11" fill="#46595f">delar behov och lösningar</text><path d="M 700.0 182 L 700.0 222" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="222" rx="12" width="1320" height="128" fill="#eef4fb" stroke="#2563eb" stroke-width="1.5" opacity="0.55"/><text x="56" y="246" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">DIGITALA KANALER — GRÄNSSNITTEN MOT ANVÄNDARNA</text><rect x="86.0" y="262" rx="10" width="400" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="286.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Webbtjänster och appar</text><text x="286.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">digital service i vardagen</text><rect x="500.0" y="262" rx="10" width="400" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Mina sidor</text><text x="700.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">registrera och följa ärenden, samlad bild av engagemang</text><rect x="914.0" y="262" rx="10" width="400" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1114.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">AI-assistenter</text><text x="1114.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">stöd och självservice</text><path d="M 700.0 350 L 700.0 396" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="378" font-size="11" fill="#46595f">krypterade, autentiserade anrop — kanalerna skapas med API:er</text><rect x="320.0" y="396" rx="10" width="760" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="421.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-infrastruktur</text><text x="700.0" y="440.0" text-anchor="middle" font-size="11.5" fill="#46595f">gemensam, säker ingång till ekosystemets funktionalitet och data</text><path d="M 700.0 454 L 700.0 500" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="500" rx="12" width="1320" height="300" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="524" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">EKOSYSTEM AV KOMPONENTER — EGENUTVECKLADE OCH UPPHANDLADE</text><rect x="79.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="229.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Kommunikation</text><text x="229.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">meddelanden och utskick i alla kanaler</text><rect x="393.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="543.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Ärende- och processtöd</text><text x="543.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">ärenden, status, automatiserade flöden</text><rect x="707.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="857.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Dokumenthantering</text><text x="857.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">lagring, signering, arkivering</text><rect x="1021.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1171.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Analys, data och AI</text><text x="1171.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">datalager och AI-infrastruktur</text><rect x="79.0" y="624" rx="10" width="614" height="64" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="386.0" y="652.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Masterdata</text><text x="386.0" y="671.0" text-anchor="middle" font-size="11" fill="#46595f">metakatalog — gemensamma grunddata om personer, företag och organisation</text><rect x="707.0" y="624" rx="10" width="614" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2"/><text x="1014.0" y="652.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Specialiserade verksamhetssystem</text><text x="1014.0" y="671.0" text-anchor="middle" font-size="11" fill="#46595f">upphandlade lösningar, anslutna via API-krav</text><rect x="79.0" y="708" rx="10" width="1242" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="736.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Paketerade lösningar</text><text x="700.0" y="755.0" text-anchor="middle" font-size="11" fill="#46595f">sammansatta tjänster av flera komponenter — återanvändbara som helhet</text><path d="M 700.0 800 L 700.0 846" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="846" rx="12" width="1320" height="96" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="870" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">OMVÄRLD</text><rect x="176.0" y="882" rx="10" width="340" height="52" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="346.0" y="904.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Nationella tjänster</text><text x="346.0" y="923.0" text-anchor="middle" font-size="10.5" fill="#46595f">myndigheters bastjänster och öppna data</text><rect x="530.0" y="882" rx="10" width="340" height="52" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="904.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Externa leverantörstjänster</text><text x="700.0" y="923.0" text-anchor="middle" font-size="10.5" fill="#46595f">distribution, signering med mera</text><rect x="884.0" y="882" rx="10" width="340" height="52" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1054.0" y="904.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Delade lösningar</text><text x="1054.0" y="923.0" text-anchor="middle" font-size="10.5" fill="#46595f">tjänster som delas mellan kommuner</text><text x="40" y="976" font-size="12" fill="#46595f">• Samma krav gäller oavsett ursprung: väl avgränsat ansvar för funktion och data, skalbarhet för hela koncernen och API:er enligt öppna standarder.</text><text x="40" y="996" font-size="12" fill="#46595f">• Kompletta lösningar skapas genom att komponenter integreras med varandra — inte genom monolitiska helhetssystem.</text><text x="40" y="1016" font-size="12" fill="#46595f">• Det som utvecklas delas öppet och kan återanvändas av andra kommuner; upphandlade lösningar ansluts till ekosystemet via API-relaterade krav.</text><rect x="40" y="1046" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="1059" font-size="12.5" fill="#1c2b33">Digitala kanaler</text><rect x="251" y="1046" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="284" y="1059" font-size="12.5" fill="#1c2b33">Gemensamma komponenter</text><rect x="510" y="1046" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="543" y="1059" font-size="12.5" fill="#1c2b33">Masterdata</text><rect x="673" y="1046" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5"/><text x="706" y="1059" font-size="12.5" fill="#1c2b33">Verksamhetssystem</text><rect x="892" y="1046" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="925" y="1059" font-size="12.5" fill="#1c2b33">Externa och delade tjänster</text></svg>