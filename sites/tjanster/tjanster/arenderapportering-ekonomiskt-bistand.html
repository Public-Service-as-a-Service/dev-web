  <script type="application/json" id="page-data">{"app":{"repo":"web-app-katla-aid","namn":"Ärenderapportering ekonomiskt bistånd","kategori":"Ärendehantering","status":"aktiv","ingress":"Webbtjänst där medarbetare rapporterar in ärenden och uppgifter kring ekonomiskt bistånd via guidade formulär.","beskrivning":["Tjänsten används för att registrera rapporter och ärenden som rör ekonomiskt bistånd. Användaren söker fram en person via personnummer eller en medarbetare via användarnamn, fyller i uppgifter steg för steg i en guidad formulärsprocess (wizard) med sammanfattning innan inskick, och kan spara utkast innan ärendet skickas in.","Inskickade rapporter samlas i en översikt där de kan filtreras och följas per status, ärendenummer och typ av rapport. Formulären styrs av centralt publicerade formulärscheman, vilket gör att innehållet i rapporterna kan ändras utan att tjänsten byggs om.","Tjänsten är under aktiv utveckling och är en systerapplikation till kommunens övriga ärendehanteringsappar byggda på samma grund. Exakt verksamhetsprocess kan därför fortfarande förändras."],"malgrupp":"handläggare och medarbetare inom socialtjänsten","funktioner":[{"titel":"Guidad rapportering","text":"Steg-för-steg-formulär med sammanfattning och kompletthetskontroll innan inskick."},{"titel":"Personsökning","text":"Sök på personnummer eller användarnamn för att koppla rapporten till rätt person eller medarbetare."},{"titel":"Utkast","text":"Rapporter kan sparas som utkast och färdigställas senare (funktion bakom funktionsflagga)."},{"titel":"Ärendeöversikt","text":"Lista över inskickade ärenden med status, ärendenummer och typ av rapport, med filtrering."},{"titel":"Schemastyrda formulär","text":"Formulärens innehåll hämtas som formulärscheman från ett centralt API."}],"apis":[{"name":"SimulatorServer","version":"2.0","usage":"Simulerade svar vid test och utveckling"},{"name":"CareManagement","version":"1.0","usage":"Hantering av ärenden inom vård/omsorg och bistånd"},{"name":"Employee","version":"2.0","usage":"Uppslag av medarbetaruppgifter via användarnamn"},{"name":"Citizen","version":"3.0","usage":"Uppslag av personuppgifter via personnummer"},{"name":"Company","version":"1.0","usage":"Uppslag av företagsuppgifter"},{"name":"JsonSchema","version":"1.0","usage":"Hämtning av formulärscheman som styr rapportformulären"}],"integrationer":["SAML IdP","WSO2 API-gateway"],"auth":"SAML (SSO) med behörighetsgrupper","teknik":{"frontend":"Next.js 16 (App Router), React 19, TypeScript, sk-web-gui, Tailwind CSS, Zustand, react-hook-form, RJSF (JSON Schema-formulär), i18next","backend":"Node.js, Express, routing-controllers, Passport SAML","tester":"Jest och Playwright (frontend), Vitest (backend)"},"konfiguration":[".env-filer för frontend och backend utifrån .env-exempel","CLIENT_KEY/CLIENT_SECRET mot kommunens API-gateway (WSO2)","SAML-certifikat och nycklar (IdP-cert, privat nyckel, callback-URL:er)","MUNICIPALITY_ID och NAMESPACE för ärendehanteringen","USE_LOCAL_SCHEMAS för att läsa formulärscheman lokalt under utveckling","Funktionsflaggor, t.ex. NEXT_PUBLIC_DRAFT_ERRAND och inaktivitetsvarning med automatisk utloggning"],"anteckningar":["README anger SupportManagement 10.7 men koden (api-config.ts) prenumererar i stället på CareManagement 1.0 samt Company och JsonSchema.","Frontend visas under sökvägen /eb (ekonomiskt bistånd) och sidrubriken är 'Ekonomiskt bistånd'.","Systerapplikation till web-app-katla-sm, byggd från samma kodbas.","Inaktivitetsvarning med nedräkning till automatisk utloggning är konfigurerbar."],"slug":"arenderapportering-ekonomiskt-bistand"},"hasSbom":true,"sbom":{"komponenter":1672,"licenser":21}}</script>
