  <script type="application/json" id="page-data">{"app":{"repo":"web-app-intric-backend","namn":"Proxytjänst för AI-assistenter","kategori":"AI-tjänster","status":"aktiv","ingress":"Gemensam serversidestjänst som förmedlar säker trafik mellan kommunens AI-chattar och AI-plattformen, inklusive tal- och översättningstjänster.","beskrivning":["Tjänsten är den gemensamma bakomliggande motorn för kommunens AI-assistenter. Den tar emot frågor från chattwidgets och appar (till exempel serviceassistenter och Pratomaten) och vidarebefordrar dem till AI-plattformen Intric/Eneo, utan att API-nycklarna exponeras i webbläsaren. Varje assistent har en egen API-nyckel som hanteras centralt här.","Utöver själva chattflödet (assistenter, sessioner, konversationer, filuppladdning, kunskapsgrupper och utrymmen) tillhandahåller tjänsten tillgång till Azures taltjänster och maskinöversättning, så att chattar kan erbjuda tal-till-text och översatta svar.","Tjänsten kan köras i internt eller externt läge. Anrop från inbäddade chattar verifieras med en beräknad hash, och det finns stöd för SAML-inloggning samt begränsning av anropstakt för att skydda mot överbelastning."],"malgrupp":"Kommunens AI-chattjänster (systemintegration); indirekt invånare och medarbetare som använder chattarna","funktioner":[{"titel":"Förmedling till AI-plattform","text":"Vidarebefordrar frågor och svar mellan chattklienter och AI-plattformen Intric/Eneo."},{"titel":"Central nyckelhantering","text":"API-nycklar för respektive assistent (bl.a. vuxenutbildning, Servanet och flera Pratomat-instanser) hålls på servern."},{"titel":"Tal och översättning","text":"Utfärdar åtkomst till Azure Speech för tal-till-text och förmedlar översättningar via Azure Translator."},{"titel":"Sessions- och filhantering","text":"Hanterar konversationer, sessioner, filuppladdningar, kunskapsgrupper och utrymmen i AI-plattformen."},{"titel":"Skydd och åtkomstkontroll","text":"Hashverifiering av inbäddade klienter, SAML-stöd samt begränsning av anropstakt."}],"apis":[{"name":"SimulatorServer","version":"2.0","usage":"Hälsokontroll av API-anslutningen (enligt api-config)."}],"integrationer":["AI-plattformen Intric/Eneo","Azure Speech (taltjänster)","Azure Translator (maskinöversättning)","SAML IdP","WSO2 API-gateway"],"auth":"Hashverifiering för inbäddade chattklienter; SAML (SSO) konfigurerbart för internt läge","teknik":{"frontend":"Minimal Next.js-frontend (från mall)","backend":"Node.js med Express och routing-controllers samt Prisma","tester":"Jest"},"konfiguration":["Miljöfil .env.example.local med INTRIC_API_BASE_URL, användaruppgifter och salt för hashverifiering","En API-nyckel per ansluten assistent (INTRIC_APIKEY_*)","Azure-nycklar för tal och översättning (AZURE_REGION, AZURE_SUBSCRIPTION_KEY, AZURE_TRANSLATOR_KEY)","SAML-certifikat och nycklar för inloggning","Läge INTERNAL/EXTERNAL samt inställningar för anropsbegränsning (rate/spike limit)"],"anteckningar":["Konfigurationen listar nycklar för bl.a. vuxenutbildningens assistent, Servanet och nio Pratomat-instanser.","Senare ändringar refererar till Eneo, det nya namnet på Intric-plattformen.","Tjänsten är i första hand ett API (proxy) – frontenddelen i repot är en mallrest."],"slug":"intric-backend"},"hasSbom":true,"sbom":{"komponenter":2040,"licenser":24}}</script>
