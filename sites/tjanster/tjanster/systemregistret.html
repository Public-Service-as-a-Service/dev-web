  <script type="application/json" id="page-data">{"app":{"repo":"web-app-systemregister","namn":"Systemregistret","kategori":"Administration","status":"aktiv","ingress":"Ett samlat register över kommunens IT-system med informationssäkerhetsklassning, GDPR-behandlingar, leverantörer och riskuppföljning.","beskrivning":["Systemregistret ger kommunen en samlad bild av alla IT-system som används i verksamheten. För varje system dokumenteras informationssäkerhetsklassning enligt K/R/T (konfidentialitet, riktighet, tillgänglighet), ansvariga, leverantörer och avtal samt systemets status, från utveckling till avveckling.","Tjänsten stödjer också det systematiska informationssäkerhetsarbetet: GDPR-behandlingar med rättslig grund och krav på konsekvensbedömning (DPIA), riskregister med uppföljning, kontinuitetsplanering och en särskild vy för AI-tillämpningar. En instrumentpanel och rapporter ger överblick, och notiser uppmärksammar exempelvis avtal som löper ut eller backuper som inte verifierats.","Behörigheten styrs i tre nivåer, där administratörer har full tillgång, redaktörer kan redigera system, leverantörer och klassningar, och övriga har läsbehörighet. Tjänsten är under aktiv utveckling och vissa delar bygger ännu på exempeldata."],"malgrupp":"Informationssäkerhetssamordnare, systemförvaltare och IT-ansvariga","funktioner":[{"titel":"Systemförteckning","text":"Registrera och följ upp kommunens IT-system med leverantörer, avtal och livscykelstatus."},{"titel":"Informationsklassning","text":"Klassa system enligt K/R/T och dokumentera bedömningar och genomförda analyser."},{"titel":"GDPR-behandlingar","text":"Förteckning över personuppgiftsbehandlingar med rättslig grund och DPIA-krav."},{"titel":"Risker och kontinuitet","text":"Dokumentera och följ upp risker samt kontinuitetsplanering kopplad till systemen."},{"titel":"AI-tillämpningar och rapporter","text":"Särskild översikt över AI-tillämpningar samt instrumentpanel, rapporter och notiser."}],"apis":[],"integrationer":["api-service-systemregister (eget dedikerat API i separat repo, Java/Spring Boot + MariaDB)","SAML IdP (kommunens IdP i drift, test-IdP lokalt)"],"auth":"SAML (SSO) med behörighetsstyrning via AD-grupper (admin/redaktör/läsare)","teknik":{"frontend":"Next.js 16, React 19, sk-web-gui","backend":"Node.js/Express (BFF) med TypeScript","tester":"Jest (backend), Cypress (frontend)"},"konfiguration":["Miljöfiler: .env (Docker/api-service), backend/.env.development.local, frontend/.env.local","API_BASE_URL pekar mot det dedikerade api-service-systemregister","SAML-nycklar och certifikat (SAML_ENTRY_SSO, SAML_IDP_PUBLIC_CERT m.fl.)","AD-grupper per behörighetsnivå (ADMIN_GROUP, EDITOR_GROUP, VIEWER_GROUP)","Miljövalidering via envalid i backend (validateEnv)"],"anteckningar":["Använder inte kommunens centrala API-gateway; all data hämtas via ett eget dedikerat API (api-service-systemregister) som körs i Docker med MariaDB.","Delar av gränssnittet (notiser och riskdata) innehåller ännu hårdkodad exempeldata, vilket tyder på pågående utveckling.","Senaste ändring augusti 2026 (SSO-inloggning via test-IdP)."],"slug":"systemregistret"},"hasSbom":true,"sbom":{"komponenter":1032,"licenser":18}}</script>
