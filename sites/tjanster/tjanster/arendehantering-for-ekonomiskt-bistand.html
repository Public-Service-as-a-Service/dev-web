  <script type="application/json" id="page-data">{"app":{"repo":"web-app-drakel","namn":"Ärendehantering för ekonomiskt bistånd","kategori":"Myndighetsutövning","status":"aktiv","ingress":"Handläggarapplikation för ärenden om ekonomiskt bistånd, med stöd för normberäkning, beslut och digitala utskick av beslut.","beskrivning":["Tjänsten är en handläggararbetsyta för ärenden inom ekonomiskt bistånd (försörjningsstöd). Handläggaren kan lista och filtrera ärenden, se ärendedetaljer med parter och kontakter, hantera bilagor, föra journalanteckningar och registrera beslut.","Inbyggda beslutsfraser enligt socialtjänstlagen underlättar att formulera bifall och avslag, och en normberäkningsfunktion hanterar hushållets personer, inkomster och utgifter som underlag för beslut. Fattade beslut kan skickas digitalt till den enskilde via Mina sidor, digital brevlåda eller brev, med automatisk kontroll av om mottagaren har digital brevlåda.","Applikationen är en avskalad vidareutveckling av kommunens tidigare handläggarapplikation, ombyggd mot ett nyare ärende-API. Utvecklingen sker stegvis och all funktionalitet från föregångaren är ännu inte på plats."],"malgrupp":"Handläggare inom ekonomiskt bistånd","funktioner":[{"titel":"Ärendelista med filtrering","text":"Överblick över ärenden med filtrering på kategori, status och typ."},{"titel":"Normberäkning","text":"Beräkningsstöd för hushållets personer, inkomster och utgifter inför beslut om ekonomiskt bistånd."},{"titel":"Beslut med frasbibliotek","text":"Registrera bifall och avslag med färdiga beslutsfraser enligt socialtjänstlagen."},{"titel":"Digitalt utskick av beslut","text":"Skicka beslut till Mina sidor, digital brevlåda eller som brev, med kontroll av digital brevlåda."},{"titel":"Journal och bilagor","text":"För journalanteckningar och hantera dokument och bilagor i ärendet."}],"apis":[{"name":"citizen","version":"3.0","usage":"Slår upp personuppgifter/personnummer för parter i ärendet."},{"name":"messaging","version":"7.0","usage":"Skickar beslut via Mina sidor, digital brevlåda och brev samt kontrollerar digital brevlåda."},{"name":"simulatorserver","version":"2.0","usage":"Simulering/test av API-anrop under utveckling."}],"integrationer":["Caremanagement-API (ärendehantering, direktanslutning utanför API-gatewayen)","WSO2 API-gateway","SAML IdP","Mina sidor och digital brevlåda (via messaging-API:et)"],"auth":"SAML (SSO) med behörighetsstyrning via AD-grupper (AUTHORIZED_GROUPS)","teknik":{"frontend":"Next.js 16, React 19, sk-web-gui","backend":"Node.js med Express 5 och routing-controllers (TypeScript, BFF)","tester":"Vitest och Playwright"},"konfiguration":[".env-filer för frontend och backend enligt exempel","CLIENT_KEY och CLIENT_SECRET från WSO2-portalen för gateway-API:er","CAREMANAGEMENT_BASE_URL för direktanslutning till ärende-API:et","SAML-certifikat och nycklar samt AUTHORIZED_GROUPS för behörighet"],"anteckningar":["Avskalad vidareutveckling av den tidigare handläggarapplikationen, med uttalat mål att minska teknisk skuld.","Ärende-API:et caremanagement anropas direkt på egen host och går medvetet inte via WSO2-gatewayen.","Typade datakontrakt genereras automatiskt hela vägen från underliggande API:er till frontend.","Repot innehåller AGENTS.md med detaljerade arbetsinstruktioner för AI-agenter och utvecklare."],"slug":"arendehantering-for-ekonomiskt-bistand"},"hasSbom":true,"sbom":{"komponenter":1242,"licenser":22}}</script>
