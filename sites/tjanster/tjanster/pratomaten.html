  <script type="application/json" id="page-data">{"app":{"repo":"web-app-pratomat","namn":"Pratomaten","kategori":"AI-tjänster","status":"aktiv","ingress":"Röststyrd AI-assistent som samlar in förslag, önskemål och synpunkter från allmänheten, till exempel vid evenemang.","beskrivning":["Pratomaten är en dialogtjänst där besökare, exempelvis vid evenemang eller i det offentliga rummet, kan svara på en öppen fråga som \"Hur skulle du vilja utveckla Sundsvalls stadskärna?\". Besökaren kan prata med assistenten via mikrofon eller skriva, och en AI-assistent följer upp svaren i en chattkonversation.","Svaren sammanställs och sparas som slutfrågor och svar i en databas, så att verksamheten kan ta del av vad deltagarna tyckt. Flera Pratomater kan köras samtidigt med olika frågor, texter och färgteman.","Till tjänsten hör ett administrationsgränssnitt där medarbetare skapar och hanterar Pratomater, kopplar dem till en AI-assistent och väljer om de ska publiceras. AI-funktionerna körs via kommunens proxytjänst mot AI-plattformen Intric/Eneo."],"malgrupp":"Allmänhet och evenemangsbesökare; kommunikatörer/medarbetare som administrerar frågorna","funktioner":[{"titel":"Röst- och textdialog","text":"Besökare kan tala in sina svar via tal-till-text eller skriva i chatten."},{"titel":"AI-uppföljning","text":"En AI-assistent ställer följdfrågor och för dialogen vidare utifrån besökarens svar."},{"titel":"Insamling av svar","text":"Slutfrågor och svar sparas i databas för senare analys av verksamheten."},{"titel":"Flera Pratomater","text":"Varje Pratomat har egen fråga, texter, färgtema och publiceringsstatus."},{"titel":"Administration","text":"Medarbetare skapar och hanterar Pratomater i ett separat admingränssnitt."}],"apis":[{"name":"SimulatorServer","version":"2.0","usage":"Hälsokontroll av API-anslutningen (enligt api-config)."}],"integrationer":["AI-plattformen Intric/Eneo (via kommunens proxytjänst)","Azure Speech (tal-till-text via proxytjänsten)","SAML IdP (admin)"],"auth
