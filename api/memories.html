  <script type="application/json" id="page-data">{"api":{"repo":"api-service-memories","namn":"Memories","slug":"memories","kategori":"Dokument och arkiv","status":null,"apiVersion":"3.11","ingress":"Sök- och hämttjänst för Sundsvallsminnens digitala arkiv – filmer, fotografier, föremål, ljudinspelningar, texter och publikationer samt register över personer, sjömän, mantal och juridiska personer.","beskrivning":["Memories exponerar Sundsvallsminnens digitala kulturarvsarkiv som ett API. Tjänsten ger sök- och hämtfunktioner för sex materialtyper – filmer, fotografier, föremål, ljud, texter och publikationer – och fyra register – personer, juridiska personer, sjömän och mantal – med metadata som titel, ämnesord och topografisk plats, så att webbplatser och applikationer kan visa arkivets innehåll för allmänheten.","Metadata ligger i en MariaDB-databas medan själva mediefilerna hämtas från en SMB-filserver (Samba) och strömmas direkt till anroparen. Fotografier finns i två varianter, miniatyr och stor bild, och filmer strömmas med stöd för HTTP Range-anrop så att uppspelning kan starta mitt i filen.","Sökningen är paginerad och endast material som markerats som publicerat i databasen lämnas ut. Ämnesord (OCM) och topografiska platser slås upp via små referenstabeller som läses in i minnet vid uppstart. Arkivträdet – arkiv, serier, volymer och samlingar – kan sökas och bläddras nod för nod med sökväg från roten, och en samlad sökning täcker alla objekttyper och register i ett anrop."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Sökning i arkivet","text":"Paginerad sökning per materialtyp (film, foto, föremål, ljud, text, publikation) med fritextmatchning mot titel och beskrivning, samt en samlad sökning över alla objekttyper och register med antal per typ, kön och verksamhetskategori."},{"titel":"Metadata per objekt","text":"Detaljvy med titel, ämnesord (OCM), topografisk plats och relaterade objekt."},{"titel":"Bildvarianter","text":"Fotografier levereras som miniatyr eller stor bild, hämtade från olika undermappar på filservern."},{"titel":"Filmströmning med Range-stöd","text":"Filmer strömmas Range-medvetet så att spelaren kan hoppa i filmen utan att ladda hela filen."},{"titel":"Endast publicerat material","text":"Sökningar och listningar omfattar bara objekt som markerats som publicerade i arkivdatabasen."},{"titel":"Register","text":"Sökning och detaljvy i register över personer, sjömän (sjömanshusen), mantalslängder och juridiska personer, med filter på namn, födelseförsamling, födelseår, kön, plats och verksamhetsperiod."},{"titel":"Arkivträd","text":"Arkiv, serier, volymer och samlingar söks per fritext, nodtyp och period; en nod hämtas med sin sökväg från roten och dess underliggande noder listas i arkivets egen ordning."},{"titel":"Topografier och kategorier","text":"Referenslistor över platser och verksamhetskategorier, med antal juridiska personer per kategori."}],"beroenden":[],"integrationer":["SMB-filserver (Samba) där arkivets mediefiler lagras och strömmas ifrån"],"databas":"MariaDB med Flyway-migrationer; arkivets metadata, ämnesord (OCM), topografi och publiceringsstatus, personregister, sjömans- och mantalsregister, juridiska personer och arkivträdet","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.10), byggd med Maven","ovrigt":"jcifs-ng för SMB-åtkomst till filservern, strömmande filleverans direkt till HTTP-svaret"},"konfiguration":["SMB-anslutning: värd, port, share, autentisering samt mappar per materialtyp","MariaDB-anslutning till arkivets metadatabas; schemat versionshanteras med Flyway","Logbook-payloadloggning är helt avstängd i denna tjänst (se anteckningar)","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Logbooks servletfilter är avsiktligt avstängt: filtret buffrar ovillkorligen hela svarskroppen i minnet, vilket för en 41 MB-film skulle ge OutOfMemory – utförligt dokumenterat med analys av dekompilerad bytekod i application.yml.","Ämnesordstabellen (OCM) läses in i minnet vid uppstart i stället för att joinas vid varje fråga, eftersom tabellen är liten och i praktiken statisk – verifierat i OcmLookup.","Mediefiler hämtas från SMB-servern och strömmas direkt till HTTP-svaret; sökvägar byggs alltid med '/' oavsett plattform, med kodkommentar som förklarar varför.","Tjänsten anropar inga andra kommun-API:er – integrationslagret består av databasen och SMB-filservern.","Versionen har gått från 3.4 till 3.11 sedan posten skrevs; tillväxten är registren, arkivträdet, den samlade sökningen och materialtypen föremål – enligt specifikationen."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":237,"licenser":14}}</script>
