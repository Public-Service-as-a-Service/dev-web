  <script type="application/json" id="page-data">{"api":{"repo":"api-service-support-management","namn":"SupportManagement","slug":"support-management","kategori":"Ärendehantering","status":null,"apiVersion":"16.0","ingress":"Ärendehanterings-API för supportärenden – skapar, uppdaterar och följer upp ärenden med kommunikation, revisioner och notifieringar åt kommunens kontaktcenter och verksamhetssystem.","beskrivning":["SupportManagement är motorn bakom kommunens hantering av supportärenden. API:et lagrar ärenden med klassificering, parter, prioritet, bilagor och parametrar, uppdelat per kommun och namnrymd (namespace) så att flera verksamheter kan använda samma tjänst med egna kategorier, statusar, roller och etiketter – all denna metadata administreras via API:et.","Kommunikationen i ett ärende samlas på ett ställe: utgående sms, e-post och webbmeddelanden skickas via Messaging, trådade konversationer synkroniseras mot MessageExchange, och schemalagda jobb hämtar in inkommande e-post via EmailReader och webbmeddelanden via WebMessageCollector och knyter dem till rätt ärende – inkommande e-post kan även skapa helt nya ärenden.","Varje ändring av ett ärende eller en anteckning sparas som en revision, och API:et kan räkna fram skillnaden mellan två valfria revisioner. Därtill finns händelseloggning via Eventlog, notifieringar till handläggare och prenumeranter, tidmätning per fas samt konfigurerbara automatiska åtgärder som utförs på ärenden."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Ärendehantering per namnrymd","text":"CRUD för supportärenden med klassificering, parter, prioritet, bilagor och parametrar – uppdelat per kommun och namnrymd."},{"titel":"Konfigurerbar metadata","text":"Kategorier, statusar, faser, roller, etiketter, kontaktorsaker och externa id-typer administreras per namnrymd via API:et."},{"titel":"Samlad ärendekommunikation","text":"Utgående sms, e-post och webbmeddelanden via Messaging samt trådade konversationer via MessageExchange – allt kopplat till ärendet."},{"titel":"Automatisk insamling av inkommande post","text":"Schemalagda jobb hämtar inkommande e-post och webbmeddelanden; inkommande e-post kan skapa nya ärenden automatiskt."},{"titel":"Revisioner med diff","text":"Varje ändring av ärenden och anteckningar sparas som revision, och skillnaden mellan två revisioner kan hämtas som JSON-patch-operationer."},{"titel":"Notifieringar och prenumerationer","text":"Notifieringar till handläggare och prenumeranter på ärenden, med schemalagd utskickshantering och daglig rensning."},{"titel":"Automatiska åtgärder och tidmätning","text":"Konfigurerbara åtgärder (t.ex. sätta etikett eller skicka e-post) körs schemalagt på ärenden, och handläggningstid mäts per fas."},{"titel":"Åtgärder på ärenden","text":"Åtgärder (measures) med ansvarig, planerad start och färdigställande, mål, beskrivning och godkännande registreras per ärende; åtgärdstyper administreras som metadata per namnrymd."},{"titel":"Massutskick och bakgrundsjobb","text":"Ett e-postmeddelande kan skickas till många mottagare i ett ärendes kontext, och ärenden som inte rörts sedan ett angivet datum rensas ut i ett asynkront jobb vars förlopp kan följas och stoppas."},{"titel":"Validering och fältbehörighet","text":"Validering mot namnrymdens metadata slås på eller av per typ, och namnrymdens konfiguration kan begränsa vilka resurser och fält en roll – eller ärendets anmälare – får nå."},{"titel":"Gemensam hanteringsmodell","text":"Yttranden, utredningar (med avsnitt) och beslut (med villkor) delar en gemensam modell för ärendehandlingar tillsammans med åtgärder, med bilagor, JSON-parametrar och bilagesyften (attachment purposes) som metadata."},{"titel":"Ärendeåtkomst per fält och resurs","text":"En ny åtkomstresurs redovisar vad den anropande användaren får läsa och ändra på ett specifikt ärende, fält för fält; namnrymdskonfigurationen listar de giltiga fälten och resurserna. Rollbaserad fältmappning och resursåtkomstkontroll kan slås på per namnrymd."}],"beroenden":[{"name":"Messaging","version":"7.12","usage":"Skickar utgående sms, e-post och webbmeddelanden i ärendekommunikationen."},{"name":"MessagingSettings","version":"2.0","usage":"Hämtar avsändar- och meddelandeinställningar för utskick."},{"name":"MessageExchange","version":"3.0","usage":"Synkroniserar trådade konversationer kopplade till ärenden."},{"name":"EmailReader","version":"4.2","usage":"Hämtar inkommande e-post som blir kommunikation eller nya ärenden."},{"name":"WebMessageCollector","version":"5.1","usage":"Hämtar webbmeddelanden från e-tjänsteplattformen via schemalagt jobb."},{"name":"Notes","version":"4.0","usage":"Lagrar och hämtar ärendeanteckningar."},{"name":"Citizen","version":"v3","usage":"Slår upp personuppgifter för parter i ärendekommunikationen."},{"name":"Employee","version":"v2","usage":"Slår upp handläggaruppgifter för notifieringar."},{"name":"Eventlog","version":"2.1","usage":"Skriver ärendehändelser till kommunens centrala händelselogg."},{"name":"Relation","version":"1.1","usage":"Hanterar relationer mellan ärenden."},{"name":"JsonSchema","version":"1.0","usage":"Validerar ärendens JSON-parametrar mot scheman."},{"name":"AccessMapper","version":null,"usage":"Hämtar användarens åtkomstgrupper för behörighetsstyrning av etiketter."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; ärenden, kommunikation, revisioner, metadata, notifieringar samt yttranden, utredningar, beslut och åtgärder (gemensam hanteringsmodell) lagras per kommun och namnrymd","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.10), byggd med Maven","ovrigt":"Schemalagda jobb med Shedlock-låsning, Resilience4j (circuit breakers), Feign-klienter, cachning av behörighetssnapshots, JSON-diff (zjsonpatch) för revisionsjämförelser"},"konfiguration":["application.yml med base-url och OAuth2-klientuppgifter (client-id/client-secret) för samtliga tolv beroende mikrotjänster","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Cron-uttryck och Shedlock-låstider för åtta schemalagda jobb (e-post, webbmeddelanden, konversationer, åtgärder, notifieringar, suspensioner, bilage-hashar med flera)","E-post- och message-exchange-integrationen konfigureras per namnrymd via API:ets konfigurationsendpoints","ROLE_BASED_MAPPING och RESOURCE_ACCESS_CONTROL är nya namnrymdskonfigurerade egenskaper som slår på rollbaserad fältmappning respektive resursåtkomstkontroll, båda av som standard","Anrop görs per kommun och namnrymd – municipalityId och namespace ingår i alla API-vägar"],"anteckningar":["Revisioner skapas genom att ärendets serialiserade ögonblicksbild jämförs med senaste revisionen – en ny revision skapas bara när innehållet faktiskt ändrats, och skillnaden mellan två revisioner räknas fram som JSON-patch-operationer (RevisionService).","Automatiska åtgärder är pluggbara: åtgärdsklasser (AddLabelAction, SendEmailAction) registreras per namn och styrs av konfiguration i databasen (ErrandActionService); från v16.0 kan en åtgärd även begränsas till specifika operationstyper.","Inkommande e-post som inte kan knytas till ett befintligt ärende skapar ett nytt ärende med avsändaren som part – verifierat i EmailReader-arbetsflödet.","Ett nattligt jobb beräknar hashar för bilagor. En användares behörighetssnapshot (etiketter, roller och resursnivåer) hämtas i ett samlat anrop till AccessMapper och cachas per användare och namnrymd (accessibleLabelsCache) – tidigare cachades bara etiketter.","Specifikationen har gått från 14.16 till 15.6 sedan posten skrevs: åtgärder och åtgärdstyper, massutskick av e-post, utrensning av ärenden som bakgrundsjobb, validering per namnrymd och fältbehörighet per roll.","Från v16.0 (major, brytande ändring): en gemensam hanteringsmodell (yttranden, utredningar med avsnitt, beslut med villkor, samt en omarbetad åtgärdsmodell) delas mellan ärendetyper, med bilagesyften som ny metadata. Samtidigt slutar API:et publicera ErrandField- och ProtectedResource-enumerationerna – namnrymdskonfigurationen deklarerar dem numera som strängar, listade via /namespace-config/access-definition, och en ny endpoint .../errands/{errandId}/access redovisar fält- och resursbehörighet per ärende och användare."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":279,"licenser":13}}</script>
