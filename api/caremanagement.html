  <script type="application/json" id="page-data">{"api":{"repo":"api-service-caremanagement","namn":"CareManagement","slug":"caremanagement","kategori":"Ärendehantering","status":null,"apiVersion":"1.0","ingress":"Ärendehantering för individ- och familjeomsorgen – i dag ansökningar om ekonomiskt bistånd – med intressenter, dokument, journal, meddelanden och beslut, drivna av BPMN-processer i Operaton och skrivna tillbaka till verksamhetssystemet Lifecare.","beskrivning":["CareManagement är ärendemotorn bakom Draken, handläggarnas gränssnitt för ekonomiskt bistånd. Ärenden lagras per kommun och namespace med intressenter, dokument, journalanteckningar, anteckningar, remisser, tillstånd, notifieringar och en beslutslogg. Ärendetyperna beskrivs av API:et självt – statusar, roller och vilka fält ärendets data ska bära – och i dag finns tre: ny, förnyad och kompletterande ansökan om ekonomiskt bistånd.","För ekonomiskt bistånd läser tjänsten den sökandes historik direkt ur Lifecare FamilyCare – aktualiseringar, beräkningar, beslut och dokument – avgör vilken ansökan invånaren ska erbjudas, förifyller förnyade ansökningar och registrerar aktualiseringen i Lifecare. Inkomstunderlaget hämtas via kommunens FinancialAid-API (SSBTEK), och normberäkningen förbereds dagligen som ett utkast handläggaren kan justera rad för rad innan den skrivs till Lifecare efter beslut. Vissa skrivningar till Lifecare köas som RPA-jobb i UiPath Orchestrator.","När ett ärende skapas kan en BPMN-processinstans startas i Operaton med ärendet som affärsnyckel; väntande processteg återupptas via meddelandekorrelering, till exempel när en handläggare godkänner eller avslår. Konversationen mellan handläggare och sökande förs i ärendet, och ett nattligt jobb arkiverar meddelandehistoriken för avslutade ärenden som PDF i Lifecare. Beslutsloggen fungerar som revisionsspår för både systemgenererade rekommendationer och handläggarbeslut."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Ärenden och ärendetyper","text":"Skapa, läsa, uppdatera och söka ärenden per kommun och namespace; ärendetyperna beskriver statusar, roller, datafält och beslutsalternativ som formulärstöd för klienter."},{"titel":"Ekonomiskt bistånd","text":"Prövning av vilken ansökan invånaren ska erbjudas (ny, förnyad eller kompletterande), förifyllnad från Lifecare, aktualisering, inkomstvarningar, bevakningar och avsnittsgodkännanden."},{"titel":"Normberäkning","text":"Dagligt förberett beräkningsutkast med personer, inkomster och utgifter som handläggaren kan redigera, ta bort och återställa rad för rad, och som skrivs till Lifecare först efter beslut."},{"titel":"Lifecare-historik","text":"Den sökandes aktualiseringar, beräkningar, beslut och dokument läses direkt ur Lifecare FamilyCare, inklusive dokumentinnehåll som PDF och om utbetalningen är verkställd."},{"titel":"Processautomation","text":"Ärenden kan starta en BPMN-processinstans i Operaton; BPMN-meddelanden korreleras till processinstansen och RPA-jobb köas i UiPath Orchestrator."},{"titel":"Dokument, journal och anteckningar","text":"Formella handlingar och journalanteckningar kan låsas till oföränderliga poster; anteckningar, remisser med svar och tillstånd med giltighetstid hanteras per ärende."},{"titel":"Konversation och notifieringar","text":"Meddelanden mellan handläggare och sökande med bilagor och lässtatus, samt notifieringar till mottagare som kvitteras och rensas efter 30 dagar."},{"titel":"Händelselogg, statushistorik och statistik","text":"Vem-gjorde-vad-logg för varje läsning och skrivning, statusövergångar per ärende och ärendestatistik för handläggargränssnittet."}],"beroenden":[{"name":"Operaton","version":"1.0","usage":"Startar processinstanser, uppdaterar processvariabler och korrelerar BPMN-meddelanden för ärendenas processer."},{"name":"Citizen","version":"v3","usage":"Översätter partyId till personnummer innan Lifecare och FinancialAid anropas."},{"name":"FinancialAid","version":null,"usage":"Hämtar den sökandes samlade inkomstunderlag ur SSBTEK (Försäkringskassans sammansatta bastjänst) via kommunens proxy."},{"name":"Messaging","version":"1.0","usage":"Klient konfigurerad; anropas ännu inte från tjänstelagret."},{"name":"Templating","version":"2.0","usage":"Klient för PDF-rendering konfigurerad; anropas ännu inte från tjänstelagret."}],"integrationer":["Lifecare FamilyCare (Tietoevry – individ- och familjeomsorgens verksamhetssystem, domän och API-nyckel)","UiPath Orchestrator (RPA-kö för skrivningar till Lifecare)"],"databas":"MariaDB med Flyway-migrationer; ärenden, intressenter, dokument, journal, anteckningar, meddelanden, remisser, tillstånd, notifieringar, beslut, händelselogg, statushistorik, formulärögonblicksbilder, beräkningsutkast och namespace-konfiguration lagras per kommun och namespace","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.10), byggd med Maven","ovrigt":"Spring Modulith (en modul per domän med händelsedriven koppling), Resilience4j, spring-filter (turkraft) för dynamiska sökfilter, JPA/Hibernate med auditering, PDFBox och Apache POI för PDF-sammanslagning och dokumentkonvertering, dept44-scheduler med ShedLock"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Operaton, Citizen, FinancialAid, Messaging, Templating och UiPath Orchestrator","Lifecare FamilyCare: bas-URL, domän och API-nyckel (valfri separat nyckel för användarkatalogen) samt 13 månaders tillbakablick för behörighetsprövningen","RPA är avstängt som standard – varje köläggning blir då en loggad no-op; kö och Orchestrator-mapp per kommun konfigureras","Regler för ekonomiskt bistånd: 90 dagars fönster för dubbla ansökningar, 30 dagars spärr för nyligen avslutade ärenden och en testflagga (return-all-types) som aldrig ska sättas i produktion","Två schemalagda jobb med ShedLock: notifieringsrensning kl. 02:00 och arkivering av meddelandehistorik kl. 03:30","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Anrop görs per kommun och namespace – municipalityId och namespace ingår i API-vägarna"],"anteckningar":["Specifikationen har växt från 40 till 126 operationer utan versionsbyte (info.version är fortfarande 1.0); resurserna för fria ärende- och intressentparametrar har tagits bort och ersatts av typade ärendedata per ärendetyp.","Behörighetsprövningen väger samman befintliga ärenden i CareManagement och Lifecare, ansökningsmånad och nyligen avslutade ärenden; ett ärende som skapas inom 30 dagar efter ett avslutat fryses för manuell granskning – enligt konfigurationen i application.yml och specifikationen.","Normberäkningen förbereds dagligen utan skrivning till Lifecare; handläggarens radändringar överlever den dagliga uppdateringen, och beräkningen skrivs till Lifecare först efter beslut – enligt specifikationens beskrivning av beräkningsresurserna.","Tjänsten gör inga utbetalningar själv – den läser bara om Lifecares manuella utbetalning för ansökningsmånaden är verkställd.","Klienter mot Messaging och Templating är konfigurerade i integrationslagret men anropas inte från tjänstelagret – verifierat med sökning i koden.","Processtart är frivillig: anges inget processdefinitionsnamn skapas ärendet utan processinstans – verifierat i ProcessService.","README är fortfarande mallens platshållartext och beskriver inte tjänsten – koden och specifikationen är sanningskällan."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":299,"licenser":15}}</script>
