  <script type="application/json" id="page-data">{"api":{"repo":"api-service-licensed-business","namn":"LicensedBusiness","slug":"licensed-business","kategori":"Samhällsservice","status":null,"apiVersion":"1.0","ingress":"Håller reda på serveringsnummer, adresser och licensinnehavare för näringsverksamheter med tillståndsplikt, till exempel serveringstillstånd för alkohol.","beskrivning":["LicensedBusiness administrerar de serveringsnummer (fyrsiffriga, unika per kommun) som knyts till en adress där en tillståndspliktig verksamhet – till exempel en restaurang med serveringstillstånd – bedrivs. API:et tilldelar nästa lediga nummer för en adress och håller reda på vilken licensinnehavare (organisationsnummer) som är kopplad till numret över tid.","Varje koppling mellan ett serveringsnummer och en licensinnehavare hanteras som en tidsbegränsad tilldelning (assignment) med giltighetsperiod och status – aktiv eller avslutad. Tilldelningar på samma nummer får inte överlappa i tid: den tidigare måste avslutas innan en ny kan skapas, och ett schemalagt jobb stänger löpande tilldelningar vars giltighetstid gått ut.","Historiska bestånd kan föras in i registret genom en engångsimport av en CSV-fil: adresser, licensinnehavare, serveringsnummer och tilldelningar skapas eller återanvänds rad för rad, och rader som pekar ut samma nummer på olika adresser rapporteras tillbaka som konflikter i importsvaret."],"malgrupp":"Kommunens applikationer och verksamhetssystem inom alkohol- och näringstillsyn","funktioner":[{"titel":"Tilldela serveringsnummer","text":"Allokerar nästa lediga fyrsiffriga serveringsnummer för en adress."},{"titel":"Tilldelningar","text":"Skapar och uppdaterar tidsbegränsade kopplingar mellan serveringsnummer och licensinnehavare, med automatisk statusuppdatering när giltighetstiden går ut. De aktiva tilldelningarna för ett serveringsnummer kan listas med adress och licensinnehavare."},{"titel":"Adresser","text":"Skapar adresser och listar dem sida för sida med sortering och filtrering."},{"titel":"Import","text":"Läser in ett historiskt bestånd av serveringsnummer, adresser, licensinnehavare och tilldelningar från en CSV-fil i ett svep."}],"beroenden":[],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; adresser, licensinnehavare, serveringsnummer och tilldelningar lagras per kommun","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.12), byggd med Maven","ovrigt":"dept44-scheduler med ShedLock för det dagliga jobbet som stänger utgångna tilldelningar, Apache Commons CSV för importen"},"konfiguration":["MariaDB-anslutning i application.yml","Cron-schema för jobbet som stänger utgångna tilldelningar (schedulers.update-assignment-status)","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Serveringsnumret är fyra siffror och allokeras som lägsta lediga nummer per kommun; krockar vid samtidiga tilldelningsförsök löses med tre nya försök innan anropet avvisas – verifierat i RestaurantNumberService.","Tilldelningar på samma serveringsnummer får aldrig överlappa, även avslutade räknas med: en ny tilldelning avslutar inte längre den tidigare, utan avvisas med 409 om perioden krockar (validFrom och validTo är båda inklusive, så den tidigare måste ha ett validTo och den nya kan börja dagen efter). Förlängs ett validTo kontrolleras överlappet på samma sätt, och serveringsnumret låses pessimistiskt under kontrollen – verifierat i AssignmentService.","CSV-importen är allt-eller-inget: hittar den några felaktiga rader sparas ingenting alls, och samtliga radfel rapporteras tillbaka i importsvaret (som mest 100 st) – verifierat i ImportService.","Organisationsnummer normaliseras till formatet NNNNNN-NNNN innan lagring. Ett tolvsiffrigt personnummer med sekelprefix (16, 19 eller 20) tas emot och sparas med tio siffror, och ett tomt lokalnamn avvisas när en tilldelning skapas eller ändras – verifierat i OrgNumberNormalizer.","Adresser kan slås upp mot sina tilldelade serveringsnummer (GET /addresses/{addressId}/restaurant-numbers) – enligt specifikationen.","Aktiva tilldelningar för ett serveringsnummer kan hämtas, äldst validFrom först, med GET /{municipalityId}/restaurant-numbers/{restaurantNumber}/assignments; tilldelningar som ännu inte börjat ingår – verifierat i AssignmentService.getActiveAssignments."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":240,"licenser":13}}</script>
