<body>
  <script type="application/json" id="page-data">{"api":{"repo":"api-service-education-data","namn":"EducationData","slug":"education-data","kategori":"Utbildning","status":null,"apiVersion":"1.0","ingress":"Samlar in nationell utbildningsdata från Skolverkets SUSA-navet och Planned Educations-API och gör utbildningarna i kommunen sökbara, med statistik över utbudet.","beskrivning":["EducationData är kommunens API för utbildningsutbudet. Schemalagda jobb hämtar utbildningstillfällen, utbildningsinformation och utbildningsanordnare från Skolverkets SUSA-navet varje dag. Tjänsten sparar bara de utbildningstillfällen som ges i kommunen, tillsammans med den information och de anordnare som hör till dem.","Utöver SUSA-navet hämtas referensdata om utbildningsområden och inriktningar från Skolverkets Planned Educations-API (v4). Utbildningarna kopplas sedan till sina områden, så att du kan filtrera på dem.","Via API:et söker du bland utbildningarna med fritext och filter, till exempel område, studieort, studietakt, skolform och datum för start och ansökan. Du kan också hämta en enskild utbildning med anordnarens namn och webbplats, och få statistik över pågående, planerade och avslutade utbildningar under en period. Varje dags insamling sparas för sig, så du kan välja vilket insamlingsdatum du frågar mot. Utan datum används den senaste insamlingen."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Sök utbildningar","text":"Söker bland kommunens utbildningar med fritext, filter och sidindelning. Svaret innehåller bland annat titel, studieort, studietakt, platser, datum och anordnare."},{"titel":"Hämta en utbildning","text":"Hämtar ett utbildningstillfälle med tillhörande utbildningsinformation, anordnarens namn och anordnarens webbplats."},{"titel":"Statistik över utbudet","text":"Räknar pågående, planerade och avslutade utbildningar, lediga platser och total kapacitet under en period, fördelat på skolform."},{"titel":"Filtervärden","text":"Listar de värden som går att filtrera på, till exempel studieorter, studietakter, undervisningsspråk, skolformer, områden och inriktningar."},{"titel":"Daglig insamling från Skolverket","text":"Hämtar utbildningstillfällen, utbildningsinformation och anordnare från SUSA-navet samt områden och inriktningar från Planned Educations-API och sparar varje dags insamling för sig."}],"beroenden":[],"integrationer":["Skolverkets SUSA-navet (nationell utbildningsdata: utbildningstillfällen, utbildningsinformation, anordnare)","Skolverkets Planned Educations-API v4 (utbildningsområden och inriktningar)"],"databas":"MariaDB med Flyway-migrationer; lagrar insamlade JSON-sidor (gzip-komprimerade) från SUSA-navet, utbildningstillfällen, utbildningsinformation och anordnare per insamlingsdatum samt referenskategorier och deras kopplingar till utbildningarna","teknik":{"sprak":"Java 25 (via dept44-föräldern)","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.1.0), byggd med Maven","ovrigt":"OpenFeign-klienter mot Skolverkets API:er, ShedLock för schemalagda jobb"},"konfiguration":["application.yml med bas-URL:er till SUSA-navet och Planned Educations-API (miljövariabler)","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Fyra schemalagda jobb med ShedLock-låsning: insamling från SUSA-navet, import av referenskategorier, uppbyggnad av utbildningsposter ur dagens insamling och koppling av utbildningar till kategorier; tidpunkterna sätts med cron-uttryck i miljövariabler","municipality-whitelist anger vilka kommuners utbildningstillfällen som sparas (2281, Sundsvall, som standard)","Anrop görs per kommun – municipalityId ingår i API-vägarna"],"anteckningar":["Ingen OpenAPI-specifikation finns incheckad i repot. API-ytan är härledd ur resursklasserna EducationResource och StatisticsResource.","Varje dags insamling sparas för sig: jobben tar först bort dagens poster och skriver sedan nya, och anropen tar ett valfritt datum som annars blir det senaste insamlingsdatumet – verifierat i EducationService.","Bara utbildningstillfällen med studieort i en kommun i municipality-whitelist sparas, och bara de anordnare som har ett sparat utbildningstillfälle – verifierat i EducationEventsService och EducationProvidersService.","SUSA-navets JSON-svar sparas också rått och gzip-komprimerat per sida, som underlag för uppbyggnaden av utbildningsposterna.","Referenskategorierna från Planned Educations-API uppdateras på plats: befintliga kategorier matchas på område och inriktning, och ett tomt svar avbryter importen med felet Bad Gateway. Kopplingarna mellan utbildningar och kategorier byggs först upp i en mellantabell och ersätter de gamla bara om alla inriktningar gick att hämta – verifierat i PlannedEducationService.","README är i stort en ofylld mall (bl.a. platshållartexter i beskrivning och beroendelista) – uppgifterna ovan är härledda ur koden."]},"hasSpec":false,"hasSbom":true,"sbom":{"komponenter":302,"licenser":14}}</script>
