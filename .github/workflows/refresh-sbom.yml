name: Refresh SBOMs

# Regenererar programvaruförteckningarna för båda katalogerna ur tjänsternas
# källkodsrepon och committar resultatet. Katalogernas egna generatorer är rena
# funktioner av apis-data.json respektive apps-data.json och kan köras för hand,
# men en SBOM följer drygt hundra externa repon som Dependabot bumpar löpande –
# den måste vara schemalagd för att vara sann.
#
# Ett arbetsflöde för båda sektionerna: de delar commit, publicering och
# keepalive, och en körning ger därmed en deploy av hela webbplatsen i stället
# för två som kan hamna i kö efter varandra.
#
# Själva förteckningarna committas inte hit utan till datarepot sbom-data (de
# är drygt 90 MB och skrivs om varje vecka). Hit committas bara sidskalen, som
# bäddar in komponentlistorna. Bygget hämtar förteckningarna med
# scripts/fetch-sbom.sh.
#
# Publicering sköts av Dokploy, som bygger om vid varje push till main. En push
# med GITHUB_TOKEN startar inga andra workflows, men repots GitHub-webhook går
# fram – commit-jobbet anropar dessutom Dokploy explicit när hemligheten
# DOKPLOY_WEBHOOK_URL är satt.

on:
  schedule:
    # 05:00 UTC på måndagar, efter tjänsternas egna CI-körningar på söndagen.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Kör bara för denna slug (t.ex. garbage eller pratomaten). Tomt = allt."
        required: false
        type: string
      sektion:
        description: "Vilken katalog som ska uppdateras."
        required: false
        default: alla
        type: choice
        options: [alla, api, tjanster]

permissions:
  contents: write

concurrency:
  group: refresh-sbom
  cancel-in-progress: false

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.build.outputs.apis }}
      apps: ${{ steps.build.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Läs sektionernas datafiler
        id: build
        env:
          ONLY: ${{ inputs.only }}
          SEKTION: ${{ inputs.sektion }}
        run: |
          sektion="${SEKTION:-alla}"
          apis='[]'
          apps='[]'
          if [ "$sektion" != "tjanster" ]; then
            apis=$(jq -c --arg only "$ONLY" \
              '[.[] | {slug, repo}] | if $only == "" then . else map(select(.slug == $only)) end' \
              sites/api/scripts/apis-data.json)
          fi
          if [ "$sektion" != "api" ]; then
            # sbom-extra.json håller repon som behöver en förteckning men saknar
            # genererad tjänstesida.
            apps=$(jq -c -s --arg only "$ONLY" \
              '[(.[0][] | {slug, repo}), (.[1].repon[] | {slug, repo})]
               | if $only == "" then . else map(select(.slug == $only)) end' \
              sites/tjanster/scripts/apps-data.json sites/tjanster/scripts/sbom-extra.json)
          fi
          total=$(( $(echo "$apis" | jq 'length') + $(echo "$apps" | jq 'length') ))
          if [ "$total" -eq 0 ]; then
            echo "::error::Inget matchade '$ONLY' i sektionen '$sektion'."
            exit 1
          fi
          echo "apis=$apis" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "$apis" | jq -r 'length | "\(.) API:er i matrisen"'
          echo "$apps" | jq -r 'length | "\(.) webbappar i matrisen"'

  sbom-api:
    name: SBOM API ${{ matrix.api.slug }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keeps us inside GitHub's concurrent-job limit and stops 75 parallel jobs
      # from hammering Maven Central into rate-limiting us.
      max-parallel: 10
      matrix:
        api: ${{ fromJson(needs.matrix.outputs.apis) }}
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v7

      - name: Checkout ${{ matrix.api.repo }}
        uses: actions/checkout@v7
        with:
          repository: Sundsvallskommun/${{ matrix.api.repo }}
          path: src
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/pom.xml

      - name: Resolve dependencies
        # Populates ~/.m2 so Trivy reads parent and BOM poms locally instead of
        # fetching them from Maven Central, which rate-limits fleet-wide scans.
        #
        # Retried because that rate-limiting also hits Maven itself: with ten
        # matrix legs resolving at once, the odd repository gets refused and the
        # leg dies even though nothing is wrong with it (measured at roughly 1% of
        # legs). Without the retry the run goes red on a transient fault, and a red
        # run that is "normal" is one nobody reads -- which is how a genuinely
        # stuck repository would sit stale for weeks unnoticed.
        working-directory: src
        run: |
          for attempt in 1 2 3; do
            if mvn -B -q dependency:go-offline -DskipTests; then
              exit 0
            fi
            echo "::warning::Dependency resolution failed (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 45))
            fi
          done
          echo "::error::Could not resolve dependencies after 3 attempts."
          exit 1

      - name: Install Trivy
        # Pinned deliberately: a Trivy upgrade can change the document contents and
        # would rewrite all 75 SBOMs at once. Bumping it should be its own reviewable
        # change, not a silent side effect of a scheduled run.
        #
        # cache: true because the download from GitHub releases is the kind of
        # transient network fault that otherwise reddens a leg for no real reason
        # (observed: curl exit 35 mid-run). With the cache, one leg downloads the
        # binary and the other 74 restore it from the Actions cache.
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Generate SPDX SBOM
        # Two things here are deliberate:
        #
        # 1. MUST run from inside the checkout and scan "." -- Trivy derives every
        #    package SPDXID from a PkgID containing the scan path, so scanning "src"
        #    instead would change every identifier and churn the whole file.
        # 2. --offline-scan resolves purely from the ~/.m2 populated above. Scanning
        #    online is both fragile (Maven Central rate-limits a fleet-wide sweep
        #    after a handful of repositories) and non-deterministic: a throttled run
        #    silently degrades licences to NOASSERTION, which would commit a diff
        #    that is not a real dependency change. Offline costs about 1% of licences
        #    and yields an identical component list.
        working-directory: src
        run: |
          trivy fs --format spdx-json --scanners license --quiet --offline-scan \
            --output "$GITHUB_WORKSPACE/raw.spdx.json" .

      - name: Normalise
        run: |
          mkdir -p public/api/assets/sbom
          python3 sites/api/scripts/normalize-sbom.py \
            --input raw.spdx.json \
            --output "public/api/assets/sbom/${{ matrix.api.slug }}.spdx.json" \
            --slug "${{ matrix.api.slug }}" \
            --repo "${{ matrix.api.repo }}" \
            --source src

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sbom-api-${{ matrix.api.slug }}
          path: public/api/assets/sbom/${{ matrix.api.slug }}.spdx.json
          if-no-files-found: error

  sbom-app:
    name: SBOM webbapp ${{ matrix.app.slug }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJson(needs.matrix.outputs.apps) }}
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v7

      - name: Checkout ${{ matrix.app.repo }}
        uses: actions/checkout@v7
        with:
          repository: Sundsvallskommun/${{ matrix.app.repo }}
          path: src
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # 24 covers the repositories that pin an engine range; the engine checks
          # are relaxed below anyway, since this job only reads package metadata.
          node-version: "24"

      - name: Install dependencies
        # Licences are the reason this step exists. An npm lockfile carries no
        # licence information at all -- Trivy reads it from
        # node_modules/<pkg>/package.json -- so without installing, the component
        # list is complete but 100% of licences come back NOASSERTION.
        #
        # Installed per sub-project, not once at the root: 24 of the 29 catalogued
        # repositories that exist locally have no root package.json at all and are
        # laid out as frontend/ + backend/ (+ admin/), roughly 2.1 lockfiles each.
        #
        # --ignore-scripts is deliberate: this would otherwise execute postinstall
        # scripts from the full transitive dependency tree of 36 repositories. The
        # licences live in package.json metadata, so no script needs to run to
        # collect them, and running them would mean introducing the exact exposure
        # this catalogue exists to document.
        #
        # A failed install is fatal for this leg rather than degraded-but-green: a
        # partial install silently turns licences into NOASSERTION, which would
        # commit a diff that is not a real dependency change. Failing keeps the
        # previously committed SBOM instead.
        working-directory: src
        run: |
          mapfile -t locks < <(find . -maxdepth 3 \
            \( -name yarn.lock -o -name package-lock.json -o -name pnpm-lock.yaml \) \
            -not -path "*/node_modules/*" -not -path "*/.yarn/*" | sort)
          if [ ${#locks[@]} -eq 0 ]; then
            echo "::error::No lockfile found in ${{ matrix.app.repo }}."
            exit 1
          fi
          echo "Found ${#locks[@]} lockfile(s)."
          corepack enable || true
          # One install per directory. A directory carrying both yarn.lock and
          # package-lock.json is a repo that migrated to yarn and left the old
          # lockfile behind: installing both means running `npm ci` against a
          # package-lock nobody maintains, which fails on the first drift.
          # yarn.lock wins where both exist.
          declare -A seen=()
          for lock in "${locks[@]}"; do
            dir=$(dirname "$lock")
            file=$(basename "$lock")
            if [ -n "${seen[$dir]:-}" ]; then
              echo "Skipping $dir/$file -- already installed with ${seen[$dir]}."
              continue
            fi
            if [ "$file" = "package-lock.json" ] && [ -f "$dir/yarn.lock" ]; then
              echo "Skipping $dir/package-lock.json -- yarn.lock present."
              continue
            fi
            seen[$dir]=$file
            echo "::group::install $dir ($file)"
            ok=0
            for attempt in 1 2 3; do
              case "$file" in
                # --ignore-engines / --engine-strict=false: several repos pin an
                # exact Node major, and nothing is being built here -- the licences
                # are read out of package.json metadata, so an engine mismatch has
                # no bearing on the result. Failing on it would drop a repo from the
                # catalogue over a version pin that does not affect the answer.
                yarn.lock)         (cd "$dir" && yarn install --frozen-lockfile --ignore-scripts --ignore-engines) && ok=1 ;;
                package-lock.json) (cd "$dir" && npm ci --ignore-scripts --engine-strict=false) && ok=1 ;;
                pnpm-lock.yaml)    (cd "$dir" && pnpm install --frozen-lockfile --ignore-scripts --config.engine-strict=false) && ok=1 ;;
              esac
              [ "$ok" -eq 1 ] && break
              echo "::warning::install failed in $dir (attempt ${attempt}/3)."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 30))
              fi
            done
            echo "::endgroup::"
            if [ "$ok" -ne 1 ]; then
              echo "::error::Could not install $dir after 3 attempts."
              exit 1
            fi
          done

      - name: Install Trivy
        # Pinned deliberately: a Trivy upgrade can change the document contents and
        # would rewrite every SBOM at once. Bumping it should be its own reviewable
        # change, not a silent side effect of a scheduled run.
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: Generate SPDX SBOM
        # MUST run from inside the checkout and scan "." -- Trivy derives every
        # package SPDXID from a PkgID containing the scan path, so scanning "src"
        # instead would change every identifier and churn the whole file.
        working-directory: src
        run: |
          # --include-dev-deps: Trivy excludes devDependencies from npm/yarn
          # lockfiles by default, which would leave the entire build chain out of
          # the report -- and the build chain is a real attack surface, so it is
          # exactly what a supply-chain document should cover. It also *improves*
          # licence coverage (91% -> 96% measured on pratomaten): build tooling is
          # well-licensed npm metadata, whereas what remains unlicensed is mostly
          # platform binaries that were never installed.
          trivy fs --format spdx-json --scanners license --quiet --offline-scan \
            --include-dev-deps --output "$GITHUB_WORKSPACE/raw.spdx.json" .

      - name: Normalise
        run: |
          mkdir -p public/tjanster/assets/sbom
          python3 sites/tjanster/scripts/normalize-sbom.py \
            --input raw.spdx.json \
            --output "public/tjanster/assets/sbom/${{ matrix.app.slug }}.spdx.json" \
            --slug "${{ matrix.app.slug }}" \
            --repo "${{ matrix.app.repo }}" \
            --source src

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sbom-app-${{ matrix.app.slug }}
          path: public/tjanster/assets/sbom/${{ matrix.app.slug }}.spdx.json
          if-no-files-found: error

  commit:
    name: Commit refreshed SBOMs
    needs: [matrix, sbom-api, sbom-app]
    # Runs even if some apps failed to scan: their artifact is simply absent and
    # the previously committed SBOM is left untouched rather than deleted.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download SBOMs (API-katalogen)
        if: needs.matrix.outputs.apis != '[]'
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-api-*
          path: public/api/assets/sbom
          merge-multiple: true

      - name: Download SBOMs (webbkatalogen)
        if: needs.matrix.outputs.apps != '[]'
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-app-*
          path: public/tjanster/assets/sbom
          merge-multiple: true

      - name: Publicera förteckningarna i sbom-data
        # Förteckningarna bor i ett eget datarepo: de är drygt 90 MB och skrivs
        # om varje vecka, vilket skulle göra webbplatsens utcheckning och
        # byggkontext lika stor. Bygget hämtar dem grunt vid varje deploy.
        id: data
        env:
          TOKEN: ${{ secrets.SBOM_DATA_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Hemligheten SBOM_DATA_TOKEN saknas – kan inte publicera i sbom-data."
            exit 1
          fi
          git clone --depth 1 --quiet \
            "https://x-access-token:$TOKEN@github.com/Public-Service-as-a-Service/sbom-data.git" \
            "$RUNNER_TEMP/sbom-data"
          mkdir -p "$RUNNER_TEMP/sbom-data/api" "$RUNNER_TEMP/sbom-data/tjanster"
          cp public/api/assets/sbom/*.spdx.json "$RUNNER_TEMP/sbom-data/api/" 2>/dev/null || true
          cp public/tjanster/assets/sbom/*.spdx.json "$RUNNER_TEMP/sbom-data/tjanster/" 2>/dev/null || true
          cd "$RUNNER_TEMP/sbom-data"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Inga ändrade förteckningar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api tjanster
          git commit -m "Uppdatera programvaruförteckningar (SBOM)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Publicerade förteckningarna i sbom-data."
              exit 0
            fi
            echo "Push avvisad (försök $attempt); hämtar och försöker igen."
            git pull --rebase origin main
          done
          echo "::error::Kunde inte pusha till sbom-data efter 3 försök."
          exit 1

      - name: Hämta hela uppsättningen förteckningar
        # En körning kan ha gällt bara en sektion (input sektion=api). Sidorna
        # genereras om för båda katalogerna, så hela uppsättningen måste finnas
        # – annars skulle den andra katalogens SBOM-sidor tas bort.
        run: sh scripts/fetch-sbom.sh

      - name: Regenerate pages
        # Only generate-pages.py is affected; the architecture diagrams are a pure
        # function of apps-data.json and are unrelated to the SBOMs. Sidorna
        # bäddar in komponentlistorna, så de genereras ur de nedladdade
        # förteckningarna (som ligger kvar i arbetskopian, men är gitignorerade).
        run: |
          python3 sites/api/scripts/generate-pages.py
          python3 sites/tjanster/scripts/generate-pages.py

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Inga ändrade sidskal - inget att committa."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api tjanster
          git commit -m "Uppdatera programvaruförteckningar (SBOM)"
          # main can move between this job's checkout and its push, which rejects
          # the push as non-fast-forward and loses the whole refresh. Rebase and
          # retry rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed refreshed SBOMs."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest main."
            git pull --rebase origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      - name: Notifiera Dokploy
        # Även en ändring som bara rör förteckningarna kräver ombyggnad:
        # bygget hämtar dem från datarepot.
        if: steps.commit.outputs.changed == 'true' || steps.data.outputs.changed == 'true'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::notice::DOKPLOY_WEBHOOK_URL saknas – deployn förlitar sig på repots GitHub-webhook."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" -o /dev/null
          echo "Dokploy notifierad."

  keepalive:
    name: Reset inactivity timer
    # Runs on every scheduled execution, whether or not anything changed. That is
    # the whole point: GitHub disables a scheduled workflow in a public repository
    # after 60 days without repository activity, and this workflow only commits
    # when a dependency actually changed -- a genuinely quiet couple of months
    # would produce no activity at all and the schedule would stop silently.
    #
    # Re-enabling the workflow through the API is what the keepalive tooling
    # settled on after moving away from dummy commits (keepalive-workflow v1 -> v2,
    # gh-workflow-immortality), and it avoids polluting the history. Note that
    # GitHub documents neither what counts as "repository activity" nor that
    # enabling resets the counter -- this is the best available mitigation, not a
    # guarantee. The state check below makes the outcome observable either way.
    needs: [sbom-api, sbom-app]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          before=$(gh api "repos/$REPO/actions/workflows/refresh-sbom.yml" --jq '.state')
          echo "state before: $before"
          if [ "$before" = "disabled_inactivity" ]; then
            echo "::warning::The schedule had been disabled for inactivity and is being re-enabled."
          fi
          gh api -X PUT "repos/$REPO/actions/workflows/refresh-sbom.yml/enable"
          after=$(gh api "repos/$REPO/actions/workflows/refresh-sbom.yml" --jq '.state')
          echo "state after: $after"
          [ "$after" = "active" ] || { echo "::error::Workflow is $after, expected active."; exit 1; }
