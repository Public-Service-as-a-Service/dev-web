lag av invånare som mottagare via personnummer."},{"name":"Company","version":"1.0","usage":"Uppslag av företag som mottagare."},{"name":"LegalEntity","version":"2.0","usage":"Uppgifter om juridiska personer."},{"name":"Employee","version":"2.0","usage":"Uppgifter om den inloggade medarbetaren och organisationstillhörighet."},{"name":"MessagingSettings","version":"3.0","usage":"Inställningar för avsändare och meddelandekanaler."},{"name":"SimulatorServer","version":"2.0","usage":"Hälsokontroll i utvecklingsmiljö."}],"integrationer":["WSO2 API-gateway (api.sundsvall.se)","SAML IdP","Digital brevlåda (via PostPortalService)"],"auth":"SAML (SSO); särskild administratörsgrupp för adminfunktioner","teknik":{"frontend":"Next.js 16, React 19, sk-web-gui, next-i18next (svenska och engelska)","backend":"Node.js/Express 5 med TypeScript","tester":"Jest, Cypress"},"konfiguration":["Miljöfiler: frontend/.env, backend/.env.development.local och .env.test.local","CLIENT_KEY/CLIENT_SECRET för WSO2-prenumerationer","SAML-certifikat, nycklar och callback-URL:er","SESSION_STORE och ADMIN_CMS_ENABLED som tillval i backend"],"anteckningar":["Startsidan anger pris per mottagare (0,5 kr för digitalt brev), vilket visar att tjänsten används skarpt för kostnadseffektiva utskick.","Repot innehåller även en separat admin-app utöver frontend och backend.","Aktivt underhållet med över 175 sammanslagna pull requests, senast juli 2026."],"slug":"postportalen"},"hasSbom":true,"sbom":{"komponenter":1611,"licenser":23}}</script>
