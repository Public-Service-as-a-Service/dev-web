# Serverkonfiguration för containern. Webbplatsen är statisk: allt som behövs
# är rätt cache-huvuden och en vettig 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sidorna ska aldrig cachas hårt: adresserna är stabila och innehållet
    # uppdateras vid varje deploy (katalogerna dessutom automatiskt varje vecka).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Bundlarna har innehållshash i filnamnet och kan cachas för alltid.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sektionernas egna filer – ritningar, OpenAPI-specar och
    # programvaruförteckningar – byter innehåll utan att byta namn och får
    # därför en kort cache med revalidering.
    location ~ ^/(arkitektur|tjanster|api)/assets/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Statisk webbplats: en adress som inte finns är ett fel, inte en väg till
    # startsidan – annars svarar vi 200 på trasiga länkar.
    location / {
        try_files $uri $uri/ =404;
    }
}
