rray="7,5"/><text x="700.0" y="278.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Intric</text><text x="700.0" y="297.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 158 C 700.0 204.0, 700.0 204.0, 700.0 250" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="40" y="362" font-size="12" fill="#46595f">• README:s API-tabell (SimulatorServer 2.0) är en kvarleva från startmallen; koden anropar enbart Intric.</text><text x="40" y="382" font-size="12" fill="#46595f">• Backend fungerar som proxy mot Intric med egna endpoints för assistenter, grupper, info-blobbar och frågor.</text><text x="40" y="402" font-size="12" fill="#46595f">• Endast en incheckning (maj 2024) – tydlig POC-karaktär.</text><rect x="40" y="430" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="443" font-size="12.5" fill="#1c2b33">Webb-app (denna applikation)</text><rect x="294.6" y="430" width="26" height="16" rx="4" fill="#bbe3cd" stroke="#15803d" stroke-width="1.5"/><text x="327.6" y="443" font-size="12.5" fill="#1c2b33">Kärn-API</text><rect x="415.20000000000005" y="430" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="448.20000000000005" y="443" font-size="12.5" fill="#1c2b33">Verksamhets-API</text><rect x="582.7" y="430" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="615.7" y="443" font-size="12.5" fill="#1c2b33">Master-data</text><rect x="723.4000000000001" y="430" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="756.4000000000001" y="443" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>