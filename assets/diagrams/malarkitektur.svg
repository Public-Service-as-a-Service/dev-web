<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1076" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Översikt över Sundsvalls kommuns målarkitektur"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="1076" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Målarkitektur — Sundsvalls kommun</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Digitala kanaler når verksamhetens förmågor via en gemensam API-plattform; bakom den ligger återanvändbara mikrotjänster.</text><rect x="40" y="86" rx="12" width="1320" height="96" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="110" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">ANVÄNDARE</text><rect x="199.0" y="122" rx="10" width="240" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="319.0" y="151.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Invånare</text><rect x="453.0" y="122" rx="10" width="240" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="573.0" y="151.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Företag</text><rect x="707.0" y="122" rx="10" width="240" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="827.0" y="151.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Medarbetare</text><rect x="961.0" y="122" rx="10" width="240" height="48" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1081.0" y="142.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Andra kommuner</text><text x="1081.0" y="161.0" text-anchor="middle" font-size="11" fill="#46595f">samverkan och återanvändning</text><path d="M 700.0 182 L 700.0 222" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="222" rx="12" width="1320" height="128" fill="#eef4fb" stroke="#2563eb" stroke-width="1.5" opacity="0.55"/><text x="56" y="246" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">DIGITALA KANALER</text><rect x="79.0" y="262" rx="10" width="300" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="229.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Webbapplikationer</text><text x="229.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">React/Next.js med backend for frontend</text><rect x="393.0" y="262" rx="10" width="300" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="543.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">E-tjänster</text><text x="543.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">Open ePlatform</text><rect x="707.0" y="262" rx="10" width="300" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="857.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">AI-assistenter</text><text x="857.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">AI-plattformen Eneo</text><rect x="1021.0" y="262" rx="10" width="300" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1171.0" y="290.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Mina sidor och portaler</text><text x="1171.0" y="309.0" text-anchor="middle" font-size="11" fill="#46595f">för invånare, företag och medarbetare</text><rect x="1150" y="194" rx="10" width="200" height="56" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1250.0" y="218.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">SAML IdP</text><text x="1250.0" y="237.0" text-anchor="middle" font-size="11" fill="#46595f">inloggning (SSO)</text><path d="M 700.0 350 L 700.0 396" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="378" font-size="11" fill="#46595f">OAuth2 (klientuppgifter) — all trafik går genom plattformen</text><rect x="350.0" y="396" rx="10" width="700" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="421.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="440.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam, säker ingång till alla verksamhets-API:er</text><path d="M 700.0 454 L 700.0 500" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="500" rx="12" width="1320" height="210" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="524" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">MIKROTJÄNSTER — ETT 70-TAL API:ER MED VAR SITT AVGRÄNSAT ANSVAR</text><rect x="79.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="229.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Kommunikation</text><text x="229.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">meddelanden, brev, sms, e-post</text><rect x="393.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="543.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Ärendehantering</text><text x="543.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">ärenden, status, beslut</text><rect x="707.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="857.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Ekonomi och fakturering</text><text x="857.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">fakturaunderlag och fakturor</text><rect x="1021.0" y="540" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1171.0" y="568.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Dokument och arkiv</text><text x="1171.0" y="587.0" text-anchor="middle" font-size="11" fill="#46595f">lagring, signering, arkivering</text><rect x="79.0" y="620" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="229.0" y="648.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Samhällsservice</text><text x="229.0" y="667.0" text-anchor="middle" font-size="11" fill="#46595f">störningar, felanmälan, avfall</text><rect x="393.0" y="620" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="543.0" y="648.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Utbildning</text><text x="543.0" y="667.0" text-anchor="middle" font-size="11" fill="#46595f">utbildningsdata och sök</text><rect x="707.0" y="620" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="857.0" y="648.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">AI-tjänster</text><text x="857.0" y="667.0" text-anchor="middle" font-size="11" fill="#46595f">AI-flöden och assistenter</text><rect x="1021.0" y="620" rx="10" width="300" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1171.0" y="648.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c2b33">Processmotor (Operaton)</text><text x="1171.0" y="667.0" text-anchor="middle" font-size="11" fill="#46595f">BPMN/DMN, återanvändbara processteg</text><path d="M 364.0 710 L 364.0 752" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 1036.0 710 L 1036.0 752" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><text x="1048.0" y="736" font-size="11" fill="#46595f">integrations-API:er kapslar in systemen</text><rect x="40" y="752" rx="12" width="648.0" height="180" fill="#fdf8ea" stroke="#b45309" stroke-width="1.5" opacity="0.55"/><text x="56" y="776" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">MASTER DATA — GEMENSAMMA GRUNDDATA</text><rect x="58.0" y="792" rx="10" width="300" height="54" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="208.0" y="815.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Party</text><text x="208.0" y="834.0" text-anchor="middle" font-size="10.5" fill="#46595f">partyId i stället för personnummer</text><rect x="370.0" y="792" rx="10" width="300" height="54" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="520.0" y="815.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Citizen</text><text x="520.0" y="834.0" text-anchor="middle" font-size="10.5" fill="#46595f">folkbokförda invånare</text><rect x="58.0" y="860" rx="10" width="300" height="54" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="208.0" y="883.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Employee</text><text x="208.0" y="902.0" text-anchor="middle" font-size="10.5" fill="#46595f">medarbetare och organisation</text><rect x="370.0" y="860" rx="10" width="300" height="54" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="520.0" y="883.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">LegalEntity</text><text x="520.0" y="902.0" text-anchor="middle" font-size="10.5" fill="#46595f">företag och organisationer</text><rect x="712.0" y="752" rx="12" width="648.0" height="180" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="728.0" y="776" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">VERKSAMHETSSYSTEM OCH EXTERNA TJÄNSTER</text><rect x="730.0" y="792" rx="10" width="300" height="54" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="880.0" y="815.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Verksamhetssystem</text><text x="880.0" y="834.0" text-anchor="middle" font-size="10.5" fill="#46595f">ByggR, Ecos, Lifecare, Raindance …</text><rect x="1042.0" y="792" rx="10" width="300" height="54" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1192.0" y="815.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Nationella tjänster</text><text x="1192.0" y="834.0" text-anchor="middle" font-size="10.5" fill="#46595f">SSBTEK, Skolverket, dataportal.se</text><rect x="730.0" y="860" rx="10" width="300" height="54" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="880.0" y="883.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Digitala brevlådor</text><text x="880.0" y="902.0" text-anchor="middle" font-size="10.5" fill="#46595f">Kivra, Min myndighetspost</text><rect x="1042.0" y="860" rx="10" width="300" height="54" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1192.0" y="883.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b33">Övriga leverantörer</text><text x="1192.0" y="902.0" text-anchor="middle" font-size="10.5" fill="#46595f">sms, tryck, signering …</text><text x="40" y="966" font-size="12" fill="#46595f">• Öppen källkod först — koden delas på github.com/Sundsvallskommun och dokumenteras öppet i API- och webbkatalogerna.</text><text x="40" y="986" font-size="12" fill="#46595f">• Varje mikrotjänst äger sina data och sin databas; kontraktet mot omvärlden är tjänstens OpenAPI-specifikation.</text><text x="40" y="1006" font-size="12" fill="#46595f">• Plattformen är byggd för flera kommuner: municipalityId ingår i API-vägarna och varje kommun konfigureras för sig.</text><rect x="40" y="1036" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="1049" font-size="12.5" fill="#1c2b33">Kommunens applikationer</text><rect x="317" y="1036" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="350" y="1049" font-size="12.5" fill="#1c2b33">Mikrotjänster (API:er)</text><rect x="586" y="1036" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="619" y="1049" font-size="12.5" fill="#1c2b33">Master data</text><rect x="767" y="1036" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="800" y="1049" font-size="12.5" fill="#1c2b33">Externa system och tjänster</text></svg>