<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för AI-chattbot för webbplatser"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="470" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — AI-chattbot för webbplatser</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop och integrationer, härledda ur källkodens konfiguration.</text><rect x="490.0" y="84" rx="10" width="420" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="117.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">Webb-app</text><text x="700.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#46595f">React 18, Vite, TypeScript, Tailwind CSS, sk-web-gui — web-app-qwerty-assistant</text><rect x="40" y="210" rx="12" width="1320" height="124" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="234" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">EXTERNA SYSTEM OCH INTEGRATIONER</text><rect x="378.5" y="250" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="481.0" y="278.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Assistent-backend (Intr…</text><text x="481.0" y="297.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 158 C 700.0 204.0, 481.0 204.0, 481.0 250" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="597.5" y="250" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="278.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">ServaNet</text><text x="700.0" y="297.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 158 C 700.0 204.0, 700.0 204.0, 700.0 250" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="816.5" y="250" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="919.0" y="278.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Vuxenutbildningen</text><text x="919.0" y="297.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 158 C 700.0 204.0, 919.0 204.0, 919.0 250" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="40" y="362" font-size="12" fill="#46595f">• Backend ingår inte i repot – klienten anropar en assistent-tjänst med endpoints /assistants och /assistants/{id}/sessions.</text><text x="40" y="382" font-size="12" fill="#46595f">• Anpassade headers (_skuser, _skhash, _skassistant, _skapp) skickas med varje anrop och verifieras av backend.</text><text x="40" y="402" font-size="12" fill="#46595f">• Senaste ändring augusti 2024, bl.a. release-anpassningar för ServaNet.</text><rect x="40" y="430" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="443" font-size="12.5" fill="#1c2b33">Webb-app (denna applikation)</text><rect x="294.6" y="430" width="26" height="16" rx="4" fill="#bbe3cd" stroke="#15803d" stroke-width="1.5"/><text x="327.6" y="443" font-size="12.5" fill="#1c2b33">Kärn-API</text><rect x="415.20000000000005" y="430" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="448.20000000000005" y="443" font-size="12.5" fill="#1c2b33">Verksamhets-API</text><rect x="582.7" y="430" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="615.7" y="443" font-size="12.5" fill="#1c2b33">Master-data</text><rect x="723.4000000000001" y="430" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="756.4000000000001" y="443" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>